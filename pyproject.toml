[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-platform-starter"
version = "0.4.0"
description = "A local robot CLI with configurable device plugins and simulated state"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
roboclaw = "robot_platform.cli:main"
robot = "robot_platform.cli:main"

[tool.setuptools.packages.find]
include = ["robot_platform*"]
